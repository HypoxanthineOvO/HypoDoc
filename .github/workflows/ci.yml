name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned HypoDoc-Spec
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 Spec
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - run: pnpm licenses:report
      - run: pnpm perf

  reference-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned HypoDoc-Spec
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 Spec
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project Spec --frozen
      - run: python3 Spec/scripts/provision-pandoc.py --version 3.10 --dest Spec/.tools/pandoc
      - run: pnpm conformance:portable

  latex-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned HypoDoc-Spec
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 Spec
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-lang-chinese latexmk poppler-utils fonts-noto-cjk
      - name: Provision pinned Pandoc
        run: |
          python3 Spec/scripts/provision-pandoc.py --version 3.10 --dest "$RUNNER_TEMP/pandoc"
          echo "$RUNNER_TEMP/pandoc/3.10/bin" >> "$GITHUB_PATH"
      - run: uv sync --project Renderers/LaTeX --frozen
      - name: LaTeX doctor
        working-directory: Renderers/LaTeX
        run: uv run hypolatex doctor
      - name: LaTeX tests
        working-directory: Renderers/LaTeX
        run: uv run python -m pytest -q tests
      - name: Representative PDF build
        working-directory: Renderers/LaTeX
        run: uv run hypolatex build examples/showcase/hypolatex-showcase.md --output build/ci-showcase.pdf
      - name: Verify non-empty PDF
        working-directory: Renderers/LaTeX
        run: test -s build/ci-showcase.pdf

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 -m pip install --user playwright pillow
      - run: python3 -m playwright install --with-deps chromium
      - name: Run browser regression (layout + fail-closed checks; pixel diff skipped on CI)
        shell: bash
        env:
          SKIP_VISUAL_DIFF: "1"
        run: |
          pnpm --filter @hypodoc/desktop dev > /tmp/hypodoc-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4317/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4317/ > /dev/null
          python3 Apps/Desktop/test/playwright_smoke.py
