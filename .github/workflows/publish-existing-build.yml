name: Publish Existing Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      source_sha:
        description: Fully validated source commit
        required: true
        type: string
      ci_run_id:
        description: Successful CI run for source_sha
        required: true
        type: string
      build_run_id:
        description: Successful Build Hosts run for source_sha
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify source and workflow runs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq .conclusion)" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .conclusion)" = "success"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

      - name: Download validated build artifacts
        run: gh run download "$BUILD_RUN_ID" --dir release-input

      - uses: astral-sh/setup-uv@v6

      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp release-input/desktop-linux-X64/HypoDoc-0.2.0-linux-amd64.deb release-assets/
          cp release-input/desktop-linux-X64/HypoDoc-0.2.0-linux-x86_64.AppImage release-assets/
          cp release-input/desktop-win-X64/HypoDoc-0.2.0-win-x64.exe release-assets/
          cp release-input/desktop-mac-ARM64/HypoDoc-0.2.0-mac-arm64.dmg release-assets/
          cp release-input/desktop-mac-ARM64/HypoDoc-0.2.0-mac-arm64.zip release-assets/
          cp release-input/hypodoc-vscode/hypodoc-vscode.vsix release-assets/
          uv build --project Renderers/LaTeX --out-dir release-assets
          expected=(
            HypoDoc-0.2.0-linux-amd64.deb
            HypoDoc-0.2.0-linux-x86_64.AppImage
            HypoDoc-0.2.0-win-x64.exe
            HypoDoc-0.2.0-mac-arm64.dmg
            HypoDoc-0.2.0-mac-arm64.zip
            hypodoc-vscode.vsix
            hypolatex-0.2.0-py3-none-any.whl
            hypolatex-0.2.0.tar.gz
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset"
          done
          test "$(find release-assets -maxdepth 1 -type f ! -name .gitignore | wc -l)" -eq 8
          (cd release-assets && sha256sum "${expected[@]}" > CHECKSUMS.txt)
          file release-assets/*

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^## Highlights/,$p' Docs/release/v0.2.0.md > release-notes.md
          cat >> release-notes.md <<'EOF'

          ## Distribution Notes

          Desktop installers are unsigned and the macOS build is not notarized. The VS Code
          extension is distributed as a manually installable VSIX. SHA-256 values for every
          uploaded package are recorded in `CHECKSUMS.txt`.
          EOF

      - name: Create and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --target "$SOURCE_SHA" \
            --title "HypoDoc v0.2.0" \
            --notes-file release-notes.md \
            --draft
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 9
          gh release edit "$TAG" --draft=false --latest
