name: Build Hosts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Apps/Desktop/**"
      - "Extensions/VSCode/**"
      - "Packages/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package installer (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @hypodoc/desktop exec electron-builder --${{ matrix.target }} --config electron-builder.yml
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ runner.arch }}
          path: |
            Apps/Desktop/release/*.AppImage
            Apps/Desktop/release/*.deb
            Apps/Desktop/release/*.exe
            Apps/Desktop/release/*.dmg
            Apps/Desktop/release/*.zip
          if-no-files-found: error

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter hypodoc-vscode build
      - run: mkdir -p release && cd Extensions/VSCode && pnpm exec vsce package --no-dependencies --out ../../release/hypodoc-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: hypodoc-vscode
          path: release/hypodoc-vscode.vsix
